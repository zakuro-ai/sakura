name: publish

# Maturin wheel matrix → PyPI for v1.0+ releases.
#
# Hardened release pipeline:
#   * Trusted Publishing via OIDC (no long-lived PyPI token)
#   * a CycloneDX SBOM published alongside the wheels
#   * SLSA L3 provenance attached to the GitHub Release
#
# This is the sakura mirror of zakuro PR #148. There is no container image
# step yet (sakura does not publish images), so Cosign signing is N/A here.
# Verification snippet for consumers will land in
# docs/security/verifying-releases.md.

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # 1. Multi-platform wheel matrix (unchanged shape — same maturin build)
  # -------------------------------------------------------------------
  wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        env:
          # Workaround for ring's ARM asm needing __ARM_ARCH defined when
          # cross-compiling for aarch64-unknown-linux-gnu via maturin's
          # manylinux docker image. Harmless on other targets.
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          manylinux: auto
      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  # -------------------------------------------------------------------
  # 2. sdist
  # -------------------------------------------------------------------
  sdist:
    name: sdist
    runs-on: cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.10"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # -------------------------------------------------------------------
  # 3. CycloneDX SBOM (deps are identical across wheels — generate once)
  # -------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: cpu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install cyclonedx-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --output-file sbom/sakura-ml.cyclonedx.json --output-format JSON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom/sakura-ml.cyclonedx.json

  # -------------------------------------------------------------------
  # 4. Hash every artefact (wheels + sdist) for the SLSA generator
  # -------------------------------------------------------------------
  hashes:
    name: Compute artifact hashes (for SLSA)
    needs: [wheels, sdist]
    runs-on: cpu
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute combined hashes
        id: hash
        working-directory: dist
        run: |
          # SLSA generator wants a base64-encoded blob of `<sha256>  <file>` lines
          # covering every subject artefact (every wheel + the sdist).
          echo "hashes=$( (sha256sum *.whl *.tar.gz 2>/dev/null || true) | base64 -w0 )" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # 5. SLSA L3 provenance covering every wheel + the sdist
  # -------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: [hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: "${{ needs.hashes.outputs.hashes }}"
      upload-assets: true   # attach to GitHub Release when present

  # -------------------------------------------------------------------
  # 6. Trusted Publishing — OIDC, no PYPI_API_TOKEN
  # -------------------------------------------------------------------
  publish:
    name: Publish to PyPI (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [wheels, sdist, sbom]
    runs-on: cpu
    environment:
      name: release
      url: https://pypi.org/project/sakura-ml/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "wheel-*"
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist
          path: dist
      - name: Show artifacts to upload
        run: ls -la dist/
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist
          # No `password`: OIDC token is fetched from the runner.

  # -------------------------------------------------------------------
  # 7. Attach the SBOM to the GitHub Release as an asset
  # -------------------------------------------------------------------
  attach-sbom:
    name: Attach SBOM to release
    if: github.event_name == 'release'
    needs: [sbom, publish]
    runs-on: cpu
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sbom
          path: sbom
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          files: sbom/sakura-ml.cyclonedx.json
