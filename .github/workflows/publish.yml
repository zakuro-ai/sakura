name: publish

# Build the abi3 wheel matrix + sdist for a release tag and upload them to
# PyPI, unless that version is already there.
#
# Triggers:
#   * push of a vX.Y.Z tag      -> build + publish that tag
#   * workflow_dispatch (tag)   -> (re)publish an existing tag, e.g. one that
#                                  was tagged before this workflow existed
#   * pull_request              -> build only, so a broken wheel build shows up
#                                  before a release does
#
# The workflow file is read from the default branch on dispatch, but the code
# that is built is always the tag itself.
#
# Auth: PYPI_API_TOKEN (repository secret), used from the `release` environment.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.1.0"
        required: true
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "crates/**"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ env.REF }}
      - name: Read the version and check PyPI
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The tag is the version: refuse to upload v1.2.0 as 1.1.9.
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/sakura-ml/$version/json")
          if [ "$code" = "200" ]; then
            echo "::notice::sakura-ml $version is already on PyPI; building only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        env:
          # ring's ARM asm needs __ARM_ARCH when cross-compiling aarch64 in
          # maturin's manylinux image. Harmless on other targets.
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ env.REF }}
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke:
    name: Install smoke test
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install the wheel and import it
        run: |
          python -m pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu dist/*.whl
          python -c "import sakura; print('sakura', sakura.__version__)"

  publish:
    name: Publish to PyPI
    needs: [plan, wheels, sdist, smoke]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/sakura-ml/${{ needs.plan.outputs.version }}/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "wheel-*"
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist
          path: dist
      - run: ls -la dist/
      - name: Upload
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
