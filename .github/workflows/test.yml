name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Skip the CIFAR-10 download in bench smoke tests; the workload falls back
  # to synthetic data, keeping CI hermetic and fast.
  SAKURA_DATASET_BUDGET_S: "0"

jobs:
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # rust-toolchain.toml pins channel="stable" and takes precedence over the
    # toolchain this job installs, so without RUSTUP_TOOLCHAIN every cargo
    # invocation here silently runs on stable and the gate checks nothing.
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Verify the pinned toolchain is actually in use
        run: |
          rustc --version | grep -q '1\.88\.' || { rustc --version; exit 1; }
      - name: cargo check (MSRV)
        run: cargo check --workspace

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features

  python-fast:
    name: Python fast (no Rust build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python deps (no maturin build)
        # Pure-python install path: CPU torch + runtime deps, package via
        # PYTHONPATH (no Rust toolchain). Guards the lazy-native-import
        # contract: `import sakura` must work without sakura_wire.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip pytest pytest-cov
          .venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install "tqdm>=4.68.2" numpy gnutools-python chardet lightning ipython "charset-normalizer>=3.4.7" "zakuro-ai>=0.2.23" cloudpickle "pydantic>=2" pyyaml pandas
      - name: Pytest (skip wire tests)
        # subset coverage is not meaningful; the 70% gate lives in the full jobs
        run: PYTHONPATH=. .venv/bin/pytest tests/ -m 'not wire and not timing' -v --cov-fail-under=0

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest pytest-cov "mypy>=1.10"
      - name: Build + install via maturin develop
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: mypy sakura/
        run: .venv/bin/mypy sakura/
      - name: Pytest (all modules, skip GPU tests)
        run: .venv/bin/pytest tests/ -v -m 'not gpu and not timing' --ignore=tests/zero/test_sharded_optimizer_nccl.py
      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
