name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install package + test deps (Unix)
        if: runner.os != 'Windows'
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[huggingface]' pytest

      - name: Install package + test deps (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv .venv
          uv pip install --python .venv/Scripts/python.exe -e '.[huggingface]' pytest

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/pytest tests/ -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/pytest.exe tests/ -v
