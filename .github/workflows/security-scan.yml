name: security-scan

# Companion to zakuro's security-scan.yml; same shape adapted to sakura's
# Maturin / Rust-extension surface (no container images yet, so no trivy
# image lane — added if/when sakura ships an image).
#
# All lanes are now strict (exit non-zero on findings). The report-only
# phase is complete — vulnerabilities cleared in PR #124.

on:
  push:
    branches: [main, master, dev]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (PyPI advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Export resolved requirements
        run: |
          uv export --format requirements-txt --no-hashes --frozen \
            > requirements.audit.txt
      - name: Install pip-audit
        run: pipx install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit \
            --requirement requirements.audit.txt \
            --vulnerability-service osv
      - name: Upload audit input on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pip-audit-input
          path: requirements.audit.txt
          retention-days: 14

  osv-scanner:
    name: osv-scanner (lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install osv-scanner
        run: |
          OSV_VERSION=2.0.0
          curl -sSL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Run osv-scanner against the lockfiles
        run: |
          osv-scanner \
            --lockfile=uv.lock \
            --lockfile=Cargo.lock \
            --recursive \
            --format=sarif \
            --output=osv-scanner.sarif
      - name: Upload SARIF
        if: always() && hashFiles('osv-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

  cargo-audit:
    name: cargo-audit (Rust crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-audit
        run: cargo audit

  trivy-fs:
    name: trivy fs (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run trivy fs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
