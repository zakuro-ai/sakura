[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "sakura-ml"
version = "1.0.0a1"
description = "Sakura: SOTA training services for PyTorch DDP / Lightning / HuggingFace Trainer."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "ZakuroAI", email = "git@zakuro.ai" }]
dependencies = [
    "tqdm>=4.67.3",
    "torch",
    "torchvision",
    "numpy",
    "gnutools-python",
    "chardet",
    "lightning",
    "ipython",
    "charset-normalizer>=3.1.0",
    "zakuro-ai>=0.2.9",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
huggingface = [
    "transformers>=5.10.2",
    "datasets>=4.8.5",
    "accelerate>=1.1.0",
]
bench = ["sakura-ml[huggingface]"]

[dependency-groups]
dev = ["pytest", "maturin>=1.4"]

[project.scripts]
sakura-worker = "sakura.worker.__main__:main"
sakura-bench = "sakura.bench.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
manifest-path = "crates/sakura-wire/Cargo.toml"
module-name = "sakura_wire"
features = ["pyo3/extension-module"]
python-packages = ["sakura"]
