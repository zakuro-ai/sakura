[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "sakura-ml"
version = "1.0.0a1"
description = "Sakura: SOTA training services for PyTorch DDP / Lightning / HuggingFace Trainer."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "ZakuroAI", email = "git@zakuro-ai.com" }]
dependencies = [
    "tqdm>=4.68.1",
    "numpy",
    "gnutools-python",
    "chardet",
    "ipython",
    "charset-normalizer>=3.4.7",
    "zakuro-ai>=0.2.23",
    "cloudpickle",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
training = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning",
]
huggingface = [
    "sakura-ml[training]",
    "transformers>=5.10.2",
    "datasets>=4.8.5",
    "accelerate>=1.13.0",
]
bench = ["sakura-ml[training,huggingface]"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "maturin>=1.4", "mypy>=1.13"]

[project.scripts]
sakura-worker = "sakura.worker.__main__:main"
sakura-bench = "sakura.bench.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require CUDA hardware (deselected in CPU-only CI with -m 'not gpu')",
]

[tool.mypy]
# Lenient on introduction (closes #102): the gate is green today and blocks
# *new* type regressions. `ignore_missing_imports` keeps torch / lightning /
# the sakura_wire Rust extension as `Any` so the check runs without the heavy
# ML stack installed. Ratchet toward `strict = true` (and drop the ignore) in
# follow-up sprints as stubs land.
python_version = "3.10"
files = ["sakura"]
ignore_missing_imports = true
strict = false

# Coverage is measured/enforced in the dedicated `coverage` CI job (full suite)
# rather than via pytest addopts, so local single-file runs and the wire-only
# CI lane aren't forced under the package-wide threshold. See .github/workflows/
# test.yml. Baseline at introduction: ~76% with branch coverage (closes #101);
# ratchet the threshold upward later.
[tool.coverage.run]
source = ["sakura"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.maturin]
manifest-path = "crates/sakura-wire/Cargo.toml"
module-name = "sakura_wire"
features = ["pyo3/extension-module"]
python-packages = ["sakura"]
