[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "sakura-ml"
version = "1.1.0"
description = "Sakura: SOTA training services for PyTorch DDP / Lightning / HuggingFace Trainer."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "ZakuroAI", email = "git@zakuro-ai.com" }]
dependencies = [
    "tqdm>=4.68.2",
    "torch",
    "torchvision",
    "numpy",
    "gnutools-python",
    "chardet",
    "lightning",
    "ipython",
    "charset-normalizer>=3.4.7",
    "zakuro-ai>=0.2.23",
    # sakura.atelier: the AtelierSpec schema and its YAML. Training stacks
    # (ludwig, ultralytics, tabpfn, peft) are NOT dependencies -- each lives in
    # its backend venv and is imported lazily (docs/atelier/CONTRACTS.md §2).
    "pydantic>=2",
    "pyyaml",
    # sakura.atelier.data: pandas is the common frame every data.format
    # converges on (CONTRACTS §1.2 / data.py docstring); it is a core dep
    # (not a backend-venv extra) because the CLI's `validate`/materialise
    # path needs it with no backend installed.
    "pandas",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
lightning = ["lightning"]
huggingface = [
    "transformers>=5.10.2",
    "datasets>=4.8.5",
    "accelerate>=1.13.0",
]
bench = ["sakura-ml[huggingface]", "nvidia-ml-py>=12.535.108"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "maturin>=1.4", "mypy>=1.10"]

[project.scripts]
sakura-worker = "sakura.worker.__main__:main"
sakura-bench = "sakura.bench.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sakura --cov-report=xml --cov-fail-under=70"
markers = [
    "gpu: requires real CUDA/MPI hardware (deselect with '-m not gpu')",
    "wire: tests requiring the compiled sakura_wire extension",
    "timing: asserts on wall-clock ratios; unreliable on contended CI runners",
]

[tool.coverage.run]
# The L'Atelier training backends drive Ludwig / Ultralytics / TabPFN / PEFT,
# none of which CI installs (each lives in its own GPU-runner venv,
# docs/atelier/envs/). Their unit tests still run here against fakes; the
# training paths are verified on the GPU runners through the engine CLI.
# Everything else in sakura/atelier (spec, registry, data, CLI) is measured.
omit = [
    "sakura/atelier/backends/ludwig.py",
    "sakura/atelier/backends/ultralytics.py",
    "sakura/atelier/backends/tabpfn.py",
    "sakura/atelier/backends/peft.py",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "lightning.*",
    "transformers.*",
    "datasets.*",
    "accelerate.*",
    "zakuro.*",
    "gnutools.*",
    "sakura_wire.*",
    "pynvml",
    "pynvml.*",
    "yaml",
    # sakura.atelier.data core dep (no stubs published)
    "pandas",
    "pandas.*",
    "soundfile",
    "datasets",
    "datasets.*",
    # atelier backends, each imported only inside its own venv
    "ludwig.*",
    "asr_deepspeech",
    "asr_deepspeech.*",
    "safetensors",
    "safetensors.*",
    "ultralytics.*",
    "tabpfn.*",
    "peft.*",
    "onnx.*",
    "onnxruntime.*",
    "sklearn.*",
    "mlx_lm.*",
    "llama_cpp.*",
]
ignore_missing_imports = true

[tool.maturin]
manifest-path = "crates/sakura-wire/Cargo.toml"
module-name = "sakura_wire"
features = ["pyo3/extension-module"]
python-packages = ["sakura"]
