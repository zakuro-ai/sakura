[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "sakura-ml"
version = "1.0.0a0"
description = "Sakura: SOTA training services for PyTorch DDP / Lightning / HuggingFace Trainer."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "ZakuroAI", email = "git@zakuro.ai" }]
dependencies = [
    "tqdm>=4.64.0",
    "torch",
    "torchvision",
    "numpy",
    "gnutools-python",
    "six",
    "chardet",
    "lightning",
    "ipython",
    "charset-normalizer==3.1.0",
    "zakuro-ai>=0.2.3",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
huggingface = [
    "transformers>=4.40.0",
    "datasets>=2.14.0",
    "accelerate>=1.1.0",
]
tensorflow = ["tensorflow>=2.15.0"]
bench = ["sakura-ml[huggingface]"]

[dependency-groups]
dev = ["pytest", "maturin>=1.4"]

[project.scripts]
sakura = "sakura.__main__:main"
sakura-benchmark = "main:main"
# sakura-worker entry-point commented out for Task 1 — sakura/worker/__main__.py
# does not exist yet. Task 12 will create it and re-enable this line.
# sakura-worker = "sakura.worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
# python-source is omitted — sakura_wire is a pure Rust extension (no Python wrapper layer).
# maturin will produce the .so directly as the module.
manifest-path = "crates/sakura-wire/Cargo.toml"
module-name = "sakura_wire"
features = ["pyo3/extension-module"]
include = [
    { path = "sakura/config.yaml", format = "sdist" },
    { path = "sakura/config.yaml", format = "wheel" },
    { path = "main.py", format = "wheel" },
]
