# Pre-commit hooks for zakuro-ai/sakura.
#
# Install once per clone with `uv run pre-commit install`, then every commit
# is gated locally on these hooks. CI re-runs them via .github/workflows/
# so we have defence in depth.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # Config (python_version, files, ignore_missing_imports) lives in
        # pyproject.toml [tool.mypy]. ignore_missing_imports lets the hook run
        # in its own isolated venv without the ML stack installed.
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.92.0
    hooks:
      - id: semgrep
        args:
          - --error
          - --config=.semgrep/sakura.yml
        types: [python]
