# speech_recognition/whisper-lora@1 -- immutable once released (CONTRACTS §1.1).
# LoRA fine-tune of a pretrained Whisper (models: whisper-small, whisper-large-v3-turbo). Sized like the La Forge
# Whisper job (r=32, alpha=64, batch 8 x accum 2, lr 1e-4, 3 epochs). `language` is the decoder's language token:
# null = let Whisper detect it; "sn" (Shona) is the proxy used for Lozi and Tonga, which Whisper does not know.
hyperparameters:
  language: null
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]
  epochs: 3
  batch_size: 8
  grad_accum: 2
  learning_rate: 0.0001
  warmup_steps: 50
  weight_decay: 0.0
  max_grad_norm: 1.0
  fp16: true
  gradient_checkpointing: false
  max_label_tokens: 224
  max_new_tokens: 128
  eval_batch_size: 8
  eval_max_samples: null
  normalize: true
  num_workers: 2
