[project]
name = "zakuro-poc-plugin"
version = "0.1.0"
description = "Claude/Codex local execution plugin POC for Zakuro-style backend abstraction"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13,<14"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5,<6",
  "pytest-timeout>=2,<3",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "hypothesis>=6,<7",
  "bandit>=1.7,<2",
  "pip-audit>=2,<3"
]

[project.scripts]
zakuro-poc = "zakuro_poc.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ARG"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=30"
markers = [
  "docker: tests requiring Docker",
  "e2e: end-to-end tests"
]

[tool.bandit]
skips = ["B108", "B404", "B603", "B607"]
